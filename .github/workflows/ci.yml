name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false

      # Warm-up import so class_name scripts register (no .godot committed).
      - name: Import project (headless)
        run: godot --headless --path . --import --quit

      # Parse-check engine scripts (app/ needs autoloads, so it is covered by
      # the boot smoke test below instead of --check-only).
      - name: Parse-check GDScript
        run: |
          fail=0
          for f in $(find scripts tests -name '*.gd' -not -path 'scripts/app/*'); do
            if godot --headless --path . --check-only --script "$f" > /tmp/check.log 2>&1; then
              :
            else
              echo "PARSE FAILED: $f"
              grep -vE '^[[:space:]]*$' /tmp/check.log | head -8 || true
              fail=1
            fi
          done
          echo "parse-check done"
          exit $fail

      # Boot the game headless (compiles app/ with autoloads + runs menu boot).
      - name: Smoke-boot game
        run: |
          timeout 120 godot --headless --path . --quit-after 30 > /tmp/boot.log 2>&1 || true
          grep -vE '^[[:space:]]*$' /tmp/boot.log | tail -8 || true
          if grep -q "SCRIPT ERROR" /tmp/boot.log; then exit 1; fi

      # GUT suite (headless, stable exit).
      - name: Run GUT tests
        env:
          GODOT_DISABLE_LEAK_CHECKS: "1"
        run: >
          godot --headless -d
          --display-driver headless
          --audio-driver Dummy
          --disable-render-loop
          --path .
          -s res://addons/gut/gut_cmdln.gd
          -gdir=res://tests
          -ginclude_subdirs
          -gexit
